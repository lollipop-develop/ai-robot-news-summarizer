name: Daily AI Robot News Summarizer

on:
  schedule:
    # Run everyday at 22:40 UTC (7:40 AM JST) to ensure it is ready before 9:00 AM JST
    - cron: '40 22 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write # Required to push the updated archive.json back to git

jobs:
  summarize-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Summarizer Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run summarize

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Only commit if archive.json changed
          if git diff --name-only | grep -q "src/data/archive.json"; then
            git add src/data/archive.json
            git commit -m "chore: auto-update news summary for $(TZ='Asia/Tokyo' date +'%Y-%m-%d') [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No news changes detected today."
          fi
